name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client — typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build refuses to run without a relay URL (vite.config.ts); CI only
      # proves the bundle compiles, so any syntactically valid wss URL works.
      - run: npm run build
        env:
          VITE_RELAY_URL: wss://ci-placeholder.invalid

  server:
    name: Server — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
