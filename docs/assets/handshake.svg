<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img">
  <title>Commit-then-reveal post-quantum handshake (animated)</title>
  <defs>
    <linearGradient id="dbg2" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0D0F18"/><stop offset="1" stop-color="#101223"/>
    </linearGradient>
    <marker id="ah2" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4 L0 8 Z" fill="#8FA6FF"/>
    </marker>
    <marker id="ahm2" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4 L0 8 Z" fill="#6B7288"/>
    </marker>
    <style>
      .s { font-family:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .pill  { font-size:15px; font-weight:650; text-anchor:middle; }
      .lbl   { font-size:13px; text-anchor:middle; fill:#C8CBD6; }
      .lblm  { font-size:12.5px; text-anchor:middle; fill:#7C839A; }
      .life  { stroke:rgba(255,255,255,.11); stroke-width:1.5; stroke-dasharray:3 5; }
      .arrow { stroke:#8FA6FF; stroke-width:1.8; marker-end:url(#ah2); }
      .arrowm{ stroke:#6B7288; stroke-width:1.5; stroke-dasharray:5 4; marker-end:url(#ahm2); }

      .row { opacity:0; animation: in .42s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes in { from { opacity:0; transform: translateY(7px); } to { opacity:1; transform:none; } }
      .heads { opacity:0; animation: in .4s ease-out .05s both; }
      .r1 { animation-delay:.20s } .r2 { animation-delay:.46s }
      .r3 { animation-delay:.72s } .r4 { animation-delay:.86s }
      .bd { animation-delay:1.12s } .r5 { animation-delay:1.46s }
      .r6 { animation-delay:1.72s } .r7 { animation-delay:1.98s }
      .lg { animation-delay:2.22s } .bx { animation-delay:2.42s }

      .pv { animation: glow 1.1s ease-out 1.12s both; }
      @keyframes glow { 0%{stroke:rgba(143,166,255,.9)} 100%{stroke:rgba(143,166,255,.22)} }
    </style>
  </defs>

  <rect x=".5" y=".5" width="1119" height="539" rx="16" fill="url(#dbg2)" stroke="rgba(255,255,255,.09)"/>

  <g class="heads">
    <rect x="75"  y="24" width="190" height="40" rx="10" fill="rgba(143,166,255,.13)" stroke="rgba(143,166,255,.34)"/>
    <text class="s pill" x="170" y="50" fill="#D8DEF6">you · initiator</text>
    <rect x="465" y="24" width="190" height="40" rx="10" fill="rgba(229,168,59,.10)" stroke="rgba(229,168,59,.32)"/>
    <text class="s pill" x="560" y="50" fill="#E5A83B">relay · untrusted</text>
    <rect x="855" y="24" width="190" height="40" rx="10" fill="rgba(143,166,255,.13)" stroke="rgba(143,166,255,.34)"/>
    <text class="s pill" x="950" y="50" fill="#D8DEF6">them · responder</text>
    <line class="life" x1="170" y1="74" x2="170" y2="434"/>
    <line class="life" x1="560" y1="74" x2="560" y2="434"/>
    <line class="life" x1="950" y1="74" x2="950" y2="434"/>
  </g>

  <g class="row r1">
    <text class="m lbl" x="365" y="98">commit = H(X25519 pub)</text>
    <line class="arrow" x1="170" y1="110" x2="560" y2="110"/>
  </g>

  <g class="row r2">
    <text class="m lbl" x="755" y="144">commit = H(X25519 pub ‖ ML-KEM pub)</text>
    <line class="arrow" x1="950" y1="156" x2="560" y2="156"/>
  </g>

  <g class="row r3">
    <text class="m lblm" x="365" y="190">peer commit</text>
    <line class="arrowm" x1="560" y1="202" x2="170" y2="202"/>
  </g>
  <g class="row r4">
    <text class="m lblm" x="755" y="190">peer commit</text>
    <line class="arrowm" x1="560" y1="202" x2="950" y2="202"/>
  </g>

  <g class="row bd">
    <rect class="pv" x="150" y="238" width="820" height="36" rx="8" fill="rgba(143,166,255,.09)" stroke="rgba(143,166,255,.22)"/>
    <text class="s" x="560" y="261" fill="#A8B8FF" font-size="14" text-anchor="middle" letter-spacing=".4">
      only now does either side reveal a key — and each is checked against the commitment already held
    </text>
  </g>

  <g class="row r5">
    <text class="m lbl" x="560" y="308">pubkey</text>
    <line class="arrow" x1="170" y1="320" x2="950" y2="320"/>
    <circle cx="560" cy="320" r="5" fill="#0D0F18" stroke="#8FA6FF" stroke-width="1.6"/>
  </g>

  <g class="row r6">
    <text class="m lbl" x="560" y="352">pubkey ‖ ML-KEM public key</text>
    <line class="arrow" x1="950" y1="364" x2="170" y2="364"/>
    <circle cx="560" cy="364" r="5" fill="#0D0F18" stroke="#8FA6FF" stroke-width="1.6"/>
  </g>

  <g class="row r7">
    <text class="m lbl" x="560" y="396">ML-KEM ciphertext · encapsulated</text>
    <line class="arrow" x1="170" y1="408" x2="950" y2="408"/>
    <circle cx="560" cy="408" r="5" fill="#0D0F18" stroke="#8FA6FF" stroke-width="1.6"/>
  </g>

  <text class="s row lg" x="560" y="434" fill="#5E6478" font-size="11.5" text-anchor="middle" letter-spacing=".5">
    ○ = forwarded by the relay, which holds no key for any of it
  </text>

  <g class="row bx">
    <rect x="60" y="456" width="1000" height="70" rx="12" fill="#12141F" stroke="rgba(255,255,255,.09)"/>
    <text class="m" x="560" y="486" fill="#D8DEF6" font-size="15" text-anchor="middle">RK₀ = KDF( X25519 secrets ‖ ML-KEM secret ‖ H(transcript) )</text>
    <text class="m" x="560" y="511" fill="#7ED9B7" font-size="14" text-anchor="middle">safety number = f( both public keys, RK₀ )</text>
  </g>
</svg>
